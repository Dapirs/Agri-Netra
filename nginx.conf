server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Weather requests go to the weather-api container (same name in docker compose and Kubernetes).
    location /api/ {
        proxy_pass http://weather-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Vite output has content hashes in the file names, so these never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Model weights are large and rarely change (file names are not hashed).
    location /model/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Single-page app: unknown paths serve index.html (never cached, so deploys show up at once).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
