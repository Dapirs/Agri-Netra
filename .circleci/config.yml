version: 2.1

# Every job runs on the same Node 22 image (matches Vite 8's requirements).
executors:
  node:
    docker:
      - image: cimg/node:22.22

commands:
  install-deps:
    description: Check out the code and install dependencies (npm cache keyed on the lockfile).
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  lint:
    executor: node
    steps:
      - install-deps
      - run:
          name: Lint
          command: npm run lint

  test:
    executor: node
    steps:
      - install-deps
      - run:
          name: Run tests
          command: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - store_test_results:
          path: test-results

  build:
    executor: node
    steps:
      - install-deps
      - run:
          name: Production build
          command: npm run build

# lint, test and build run in parallel on every push and pull request.
workflows:
  ci:
    jobs:
      - lint
      - test
      - build
