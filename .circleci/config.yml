version: 2.1

# Set to true only by the nightly schedule (CircleCI → Project Settings → Triggers).
parameters:
  nightly-scan:
    type: boolean
    default: false

# Every job runs on the same Node 22 image (matches Vite 8's requirements).
executors:
  node:
    docker:
      - image: cimg/node:22.22

commands:
  install-deps:
    description: Check out the code and install dependencies (npm cache keyed on the lockfile).
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  lint:
    executor: node
    steps:
      - install-deps
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Check formatting
          command: npm run format:check
      - run:
          name: Audit production dependencies
          # Only packages that ship in the app; fails on high or critical advisories.
          command: npm audit --omit=dev --audit-level=high

  test:
    executor: node
    steps:
      - install-deps
      - run:
          name: Run tests
          command: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - store_test_results:
          path: test-results

  build:
    executor: node
    steps:
      - install-deps
      - run:
          name: Production build
          command: npm run build

  docker-build:
    # A machine executor is a full VM with Docker and docker compose preinstalled.
    machine:
      image: ubuntu-2404:current
    environment:
      # Dummy key: nothing in this job calls OpenWeatherMap. docker-compose.yml just
      # requires it to be non-empty for EVERY docker compose command (up, ps, logs).
      OPENWEATHER_API_KEY: ci-dummy-key
    steps:
      - checkout
      - run:
          name: Build both images and start the stack
          command: docker compose up -d --build
      - run:
          name: Wait for the website to answer
          command: |
            for i in $(seq 1 30); do
              if curl -fs -o /dev/null http://localhost:8080/healthz; then
                echo "website is up"
                exit 0
              fi
              sleep 2
            done
            echo "website did not come up in time"
            docker compose ps
            docker compose logs --no-color
            exit 1
      - run:
          name: Smoke tests
          command: |
            curl -fsS -o /tmp/index.html http://localhost:8080/
            grep -q '<div id="root">' /tmp/index.html
            # Deep links must fall back to index.html (single-page app)
            curl -fsS -o /tmp/deep.html http://localhost:8080/dashboard/anything
            grep -q '<div id="root">' /tmp/deep.html
            # Model files are served
            curl -fsS -o /dev/null http://localhost:8080/model/model.json
            curl -fsS -o /dev/null http://localhost:8080/model/class_indices.json
            # A missing asset is a real 404, not index.html
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/does-not-exist.js)
            test "$status" = "404" || { echo "expected 404 for a missing asset, got $status"; exit 1; }
            # nginx forwards /api/ to the weather server, which rejects bad coordinates
            status=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/api/weather?lat=abc&lon=1')
            test "$status" = "400" || { echo "expected 400 through the proxy, got $status"; exit 1; }
            # Security headers on every kind of response, including errors
            asset=$(grep -o '/assets/[^"]*\.js' /tmp/index.html | head -n 1)
            for path in / /dashboard/anything "$asset" /assets/does-not-exist.js /model/model.json \
                '/api/weather?lat=abc&lon=1' /healthz; do
              headers=$(curl -s -D - -o /dev/null "http://localhost:8080$path")
              for header in 'X-Content-Type-Options: nosniff' 'X-Frame-Options: DENY' 'Referrer-Policy: same-origin'; do
                echo "$headers" | grep -qi "^$header" || { echo "missing '$header' on $path"; exit 1; }
              done
            done
            # Adding those headers must not drop the per-folder cache rules
            curl -s -D - -o /dev/null "http://localhost:8080$asset" | grep -qi '^Cache-Control: .*immutable' \
              || { echo "assets lost their Cache-Control"; exit 1; }
            curl -s -D - -o /dev/null http://localhost:8080/model/model.json | grep -qi '^Cache-Control: .*max-age=604800' \
              || { echo "model files lost their Cache-Control"; exit 1; }
            curl -s -D - -o /dev/null http://localhost:8080/ | grep -qi '^Cache-Control: no-cache' \
              || { echo "index.html lost its Cache-Control"; exit 1; }
            echo "smoke tests passed"
      - run:
          name: Scan both images for known vulnerabilities (Trivy)
          # Fails on HIGH/CRITICAL problems that have a fix. Pinned by digest after the March 2026 Trivy
          # supply-chain attack; it gets the Docker socket, so it runs here (no secrets), not in docker-publish.
          command: |
            # Scan every image before failing, so one run shows all findings.
            status=0
            for image in $(docker compose config --images); do
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image \
                --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image" || status=1
            done
            exit $status
      - run:
          name: Container status and logs
          when: always
          command: |
            docker compose ps
            docker compose logs --no-color

  secrets-scan:
    # Scans every commit on every branch for leaked secrets (API keys, tokens, passwords).
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Scan git history for secrets (gitleaks)
          # Runs as the CI user so git trusts the mounted repo. Pinned by digest, like Trivy.
          command: |
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
              zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --verbose .

  scan-published-images:
    # Nightly: new vulnerabilities are published every day, so re-scan what is already on Docker Hub.
    machine:
      image: ubuntu-2404:current
    steps:
      - run:
          name: Scan the published images (Trivy)
          command: |
            status=0
            for image in dapirs2006/agri-netra:latest dapirs2006/agri-netra-api:latest; do
              docker run --rm \
                aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image \
                --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image" || status=1
            done
            exit $status

  docker-publish:
    # Pushes both images to Docker Hub. Runs only on main, after every other check passed.
    machine:
      image: ubuntu-2404:current
    environment:
      WEB_IMAGE: dapirs2006/agri-netra
      API_IMAGE: dapirs2006/agri-netra-api
    steps:
      - checkout
      - run:
          name: Log in to Docker Hub
          # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN come from the docker-hub context.
          command: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Install QEMU so the arm64 images can run their build commands (apk upgrade)
          command: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run:
          name: Set up a builder that can make Intel and Apple Silicon images
          command: docker buildx create --name multiarch --driver docker-container --use
      - run:
          name: Build and push both images (amd64 + arm64)
          command: |
            tag=${CIRCLE_SHA1:0:7}
            docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile \
              -t "$WEB_IMAGE:$tag" -t "$WEB_IMAGE:latest" --push .
            docker buildx build --platform linux/amd64,linux/arm64 -f server/Dockerfile \
              -t "$API_IMAGE:$tag" -t "$API_IMAGE:latest" --push .
      - run:
          name: Check every pushed tag has both platforms
          command: |
            tag=${CIRCLE_SHA1:0:7}
            for ref in "$WEB_IMAGE:$tag" "$WEB_IMAGE:latest" "$API_IMAGE:$tag" "$API_IMAGE:latest"; do
              manifest=$(docker buildx imagetools inspect "$ref")
              for platform in linux/amd64 linux/arm64; do
                echo "$manifest" | grep -q "Platform: *$platform" || { echo "$ref is missing $platform"; exit 1; }
              done
              echo "$ref: amd64 + arm64"
            done

# lint, test, build, docker-build and secrets-scan run in parallel on every push and pull request.
# docker-publish runs only on main, once all five have passed.
workflows:
  ci:
    when:
      not: << pipeline.parameters.nightly-scan >>
    jobs:
      - lint
      - test
      - build
      - docker-build
      - secrets-scan
      - docker-publish:
          context: docker-hub
          requires: [lint, test, build, docker-build, secrets-scan]
          filters:
            branches:
              only: main

  # Runs only from the nightly schedule; fix a failure by re-running the latest main pipeline.
  nightly-scan:
    when: << pipeline.parameters.nightly-scan >>
    jobs:
      - scan-published-images
